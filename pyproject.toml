[project]
name = "careflow"
version = "0.2.0"
description = "Deterministic patient navigation engine for cancer screening-to-care journeys"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "cryptography>=43.0.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "scratch",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "BLE001",
]

[tool.ruff.lint.isort]
known-first-party = ["careflow"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
